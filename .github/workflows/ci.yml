name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test-ios:
    name: Build & Test (iOS)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild \
            -project ClickStick.xcodeproj \
            -scheme ClickStick \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test 2>&1 | xcbeautify
